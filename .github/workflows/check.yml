# Automated Release Gate: Runs dependency check, linting, typechecking, tests, and production build on every push and PR.
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_TODAY: "2026-11-05"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install clean dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Code Quality & Test Suite
        run: npm run check
      - name: Production Next.js Build
        run: npm run build
