<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b2c" />
    <title>Offline | NeverShort</title>
    <style>
      :root { --ink: #14201b; --muted: #56605b; --brand: #0e3b2c; --surface: #f3f5f2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: var(--surface); color: var(--ink); font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      header { background: var(--brand); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 20px 10px; font-size: 13px; }
      main { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
      .card { background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 0 0 1px rgb(20 32 27 / 0.06); }
      h1 { font-family: "Iowan Old Style", Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.12; letter-spacing: -0.02em; margin: 0; }
      p { color: var(--muted); margin: 12px 0 0; }
      a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 20px; padding: 0 16px; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 500; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>NeverShort</header>
    <main>
      <div class="card" role="alert">
        <h1>You're offline.</h1>
        <p>NeverShort needs a connection to work out your numbers. Nothing has moved: no payment or reminder runs without the Margin Guard.</p>
        <a href="/">Try again</a>
      </div>
    </main>
  </body>
</html>
